<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIDAL PARTICLES / 3D Gesture Lab</title>
<style>
:root{--bg:#070b12;--panel:#0d1420cc;--line:#ffffff1c;--text:#eef5ff;--muted:#8b9ab0;--accent:#8ed8ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif}#scene{position:fixed;inset:0}#scene canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none;display:flex;justify-content:space-between;padding:22px;z-index:5}.panel{pointer-events:auto;background:linear-gradient(145deg,#111b2aee,#0a111bd9);border:1px solid var(--line);box-shadow:0 18px 60px #0008;backdrop-filter:blur(16px);border-radius:16px}.brand{padding:14px 17px;min-width:220px}.brand b{font-size:13px;letter-spacing:.18em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.11em;margin-top:6px}.left{display:flex;flex-direction:column;gap:12px}.controls{width:250px;padding:16px}.label{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin:0 0 9px}.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.model{border:1px solid var(--line);background:#ffffff08;color:var(--muted);padding:10px 8px;border-radius:9px;text-align:left;font-size:11px;cursor:pointer;transition:.2s}.model:hover,.model.active{color:var(--text);border-color:var(--accent);background:#8ed8ff16}.model span{font-size:16px;display:block;margin-bottom:5px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:17px}.color{width:42px;height:30px;border:0;padding:0;background:none;cursor:pointer}.range{width:100%;accent-color:var(--accent)}.button{border:1px solid var(--line);background:#ffffff0b;color:var(--text);padding:10px 12px;border-radius:9px;font-size:11px;cursor:pointer}.button.primary{background:var(--accent);color:#06101b;border-color:var(--accent);font-weight:700}.right{display:flex;flex-direction:column;align-items:flex-end;gap:12px}.status{width:242px;padding:15px}.status-line{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:11px}.status-line span{color:var(--muted)}.status-line b{font-size:12px;color:var(--accent);font-weight:500}.hint{padding:12px 15px;width:242px;color:var(--muted);font-size:11px;line-height:1.7}.hint strong{color:var(--text);font-weight:500}.bottom{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);pointer-events:auto;display:flex;gap:8px}.gesture-chip{padding:9px 13px;border:1px solid var(--line);background:#0d1420cc;backdrop-filter:blur(12px);border-radius:99px;color:var(--muted);font-size:11px}.gesture-chip b{color:var(--accent);font-weight:500;margin-left:5px}.video{position:fixed;right:22px;bottom:22px;width:120px;aspect-ratio:4/3;object-fit:cover;opacity:.0;border-radius:10px;transform:scaleX(-1);pointer-events:none}.cross{position:fixed;inset:0;pointer-events:none;display:grid;place-items:center;opacity:.38}.cross:before,.cross:after{content:"";position:absolute;background:#ffffff20}.cross:before{width:1px;height:34px}.cross:after{width:34px;height:1px}.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-12px);opacity:0;transition:.3s;background:#edf6ff;color:#08111d;padding:10px 15px;border-radius:99px;font-size:11px;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:700px){.ui{padding:12px}.brand{min-width:0}.brand small{display:none}.controls{width:205px;padding:12px}.status,.hint{width:190px}.hint{display:none}.model{padding:8px 6px;font-size:10px}.bottom{bottom:13px;width:calc(100% - 24px);justify-content:center;flex-wrap:wrap}.gesture-chip{font-size:10px}}
</style>
</head>
<body>
<div id="scene"></div><div class="cross"></div><div class="toast" id="toast"></div>
<div class="ui"><div class="left"><div class="panel brand"><b>TIDAL PARTICLES</b><small>REALTIME GESTURE / 3D FIELD</small></div><div class="panel controls"><p class="label">粒子模型</p><div class="model-grid" id="models"><button class="model active" data-model="heart"><span>♡</span>爱心</button><button class="model" data-model="flower"><span>✺</span>花朵</button><button class="model" data-model="saturn"><span>◉</span>土星</button><button class="model" data-model="firework"><span>✦</span>烟花</button><button class="model" data-model="earth"><span>⊕</span>地球</button><button class="model" data-model="mountain"><span>⌁</span>千里江山</button><button class="model" data-model="epiphyllum"><span>✽</span>昙花</button></div><div class="row"><span class="label" style="margin:0">粒子颜色</span><input id="color" class="color" type="color" value="#8ed8ff" aria-label="粒子颜色"></div><div class="row"><span class="label" style="margin:0">粒子密度</span><input id="density" class="range" type="range" min="1800" max="8500" step="100" value="5200"></div><div class="row"><button id="cameraBtn" class="button primary">开启手势识别</button><button id="fullscreen" class="button" title="全屏">⛶</button></div></div></div><div class="right"><div class="panel status"><p class="label">实时状态</p><div class="status-line"><span>输入</span><b id="inputState">鼠标演示</b></div><div class="status-line"><span>张合度</span><b id="openValue">—</b></div><div class="status-line"><span>粒子能量</span><b id="energyValue">64%</b></div><div class="status-line"><span>渲染</span><b>60 FPS</b></div></div><div class="panel hint"><strong>手势提示</strong><br>张开 / 合拢手掌：粒子扩散与聚合<br>食指左右摆动：旋转模型<br>食指靠近 / 拉远：缩放场域</div></div></div>
<div class="bottom"><div class="gesture-chip">OPEN HAND <b>EXPAND</b></div><div class="gesture-chip">PINCH <b>ATTRACT</b></div><div class="gesture-chip">INDEX <b>ORBIT</b></div></div><video id="video" class="video" autoplay playsinline muted></video>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const THREE=window.THREE, root=document.getElementById('scene'),video=document.getElementById('video'),toast=document.getElementById('toast');let renderer,scene,camera,points,geometry,material,model='heart',count=5200,color='#8ed8ff',stream=null,mpHands,frameLoop=false,basePositions;let hand={active:false,detected:false,open:.55,x:.5,y:.5,depth:.5,targetOpen:.55,targetX:.5,targetY:.5,targetDepth:.5};
const TAU=Math.PI*2,rand=(a,b)=>Math.random()*(b-a)+a;const temp=new THREE.Vector3();
function setup(){scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x070b12,.045);camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);camera.position.z=8.5;renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);root.appendChild(renderer.domElement);createParticles();addEventListener('resize',resize);animate()}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function createParticles(){if(points){scene.remove(points);geometry.dispose();material.dispose()}geometry=new THREE.BufferGeometry();const pos=new Float32Array(count*3),seed=new Float32Array(count*4);for(let i=0;i<count;i++){const p=shapePoint(model,i,count);pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;seed[i*4]=Math.random();seed[i*4+1]=Math.random();seed[i*4+2]=Math.random();seed[i*4+3]=Math.random()}basePositions=new Float32Array(pos);geometry.setAttribute('position',new THREE.BufferAttribute(pos,3));geometry.setAttribute('aSeed',new THREE.BufferAttribute(seed,4));material=new THREE.PointsMaterial({color,size:.032,sizeAttenuation:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false});points=new THREE.Points(geometry,material);scene.add(points)}
function shapePoint(type,i,n){const u=i/n,a=rand(0,TAU),r=Math.sqrt(Math.random());let x=0,y=0,z=0;if(type==='heart'){const t=u*TAU*2;const s=.075+Math.random()*.05;x=16*Math.pow(Math.sin(t),3)*s;y=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s;z=rand(-.18,.18)+(Math.random()-.5)*.25}else if(type==='flower'||type==='epiphyllum'){const petals=type==='flower'?7:12;const rr=(1.35*Math.cos(petals*a)+1.5)*r;x=Math.cos(a)*rr;y=Math.sin(a)*rr;z=(Math.random()-.5)*.25+Math.sin(a*petals)*.18}else if(type==='saturn'){if(i<n*.67){const phi=Math.acos(rand(-1,1));x=1.15*Math.sin(phi)*Math.cos(a);y=1.15*Math.sin(phi)*Math.sin(a);z=1.15*Math.cos(phi)}else{const rr=rand(1.55,2.25);x=rr*Math.cos(a);y=rr*Math.sin(a)*.35;z=rand(-.06,.06)}}else if(type==='firework'){const ray=Math.floor(rand(0,18))*TAU/18;const rr=Math.pow(Math.random(),.35)*2.35;x=Math.cos(ray)*rr+rand(-.08,.08);y=Math.sin(ray)*rr+rand(-.08,.08);z=rand(-.3,.3)+Math.sin(rr*5)*.1}else if(type==='earth'){const phi=Math.acos(rand(-1,1));x=1.45*Math.sin(phi)*Math.cos(a);y=1.45*Math.sin(phi)*Math.sin(a);z=1.45*Math.cos(phi);if(Math.sin(a*3+phi*2)>.72){x*=1.02;y*=1.02}}else if(type==='mountain'){x=(u-.5)*3.8;y=-.8+Math.sin(x*2.7)*.35+Math.max(0,Math.sin(x*3.1+a)*.65);z=(Math.random()-.5)*1.35}else{x=Math.cos(a)*r*1.7;y=Math.sin(a)*r*1.1;z=rand(-.35,.35)}return{x,y,z}}
function animate(t=0){requestAnimationFrame(animate);hand.open+=(hand.targetOpen-hand.open)*.09;hand.x+=(hand.targetX-hand.x)*.08;hand.y+=(hand.targetY-hand.y)*.08;hand.depth+=(hand.targetDepth-hand.depth)*.08;if(points){const s=0.72+hand.open*1.25;points.scale.setScalar(s);points.rotation.y+=(hand.x-.5)*.018;points.rotation.x+=(.5-hand.y)*.012;points.rotation.z+=.0015+(hand.x-.5)*.004;const arr=geometry.attributes.position.array,followX=(hand.x-.5)*2.6,followY=(.5-hand.y)*2.1,depthPull=(.5-hand.depth)*1.7;for(let i=0;i<count;i++){const j=i*3,seed=i*.17;const wobble=Math.sin(t*.0018+seed)*.045+Math.cos(t*.0011+seed*1.7)*.035;const targetX=basePositions[j]+followX*(.22+hand.open*.3)+wobble;const targetY=basePositions[j+1]+followY*(.22+hand.open*.3)+Math.sin(t*.0014+seed)*.04;const targetZ=basePositions[j+2]+depthPull*(.35+hand.open*.25)+Math.cos(t*.0016+seed)*.035;arr[j]+=(targetX-arr[j])*.055;arr[j+1]+=(targetY-arr[j+1])*.055;arr[j+2]+=(targetZ-arr[j+2])*.055}geometry.attributes.position.needsUpdate=true;material.size=.026+hand.open*.018;material.color.set(color)}document.getElementById('openValue').textContent=Math.round(hand.open*100)+'%';document.getElementById('energyValue').textContent=Math.round(48+hand.open*50)+'%';renderer.render(scene,camera)}
function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove('show'),2600)}
document.querySelectorAll('.model').forEach(b=>b.onclick=()=>{document.querySelectorAll('.model').forEach(x=>x.classList.remove('active'));b.classList.add('active');model=b.dataset.model;createParticles();notify('已切换：'+b.textContent.trim())});document.getElementById('color').oninput=e=>{color=e.target.value};document.getElementById('density').oninput=e=>{count=+e.target.value;createParticles()};document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();root.addEventListener('pointermove',e=>{if(hand.active)return;hand.targetX=e.clientX/innerWidth;hand.targetY=e.clientY/innerHeight;hand.targetOpen=.35+.65*(1-e.clientY/innerHeight)});
async function toggleCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;frameLoop=false;hand.active=false;hand.detected=false;document.getElementById('inputState').textContent='鼠标演示';document.getElementById('cameraBtn').textContent='开启手势识别';notify('已返回鼠标演示');return}if(!navigator.mediaDevices?.getUserMedia){notify('当前页面没有摄像头权限，请用 localhost 或 HTTPS 打开');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:false});video.srcObject=stream;await video.play();hand.active=true;document.getElementById('inputState').textContent='摄像头连接中';document.getElementById('cameraBtn').textContent='关闭手势识别';if(!window.Hands){notify('手势模型脚本未加载，请检查网络连接');return}mpHands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});mpHands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.65,minTrackingConfidence:.6});mpHands.onResults(r=>{const lm=r.multiHandLandmarks?.[0];if(!lm){hand.detected=false;document.getElementById('inputState').textContent='摄像头 / 未检测到手';hand.targetOpen=.45;return}hand.detected=true;document.getElementById('inputState').textContent='摄像头 / 单手已识别';const wrist=lm[0],tips=[8,12,16,20].map(i=>lm[i]);const avg=tips.reduce((s,p)=>s+Math.hypot(p.x-wrist.x,p.y-wrist.y),0)/4;hand.targetOpen=Math.max(0,Math.min(1,(avg-.18)/.32));hand.targetX=1-lm[8].x;hand.targetY=lm[8].y;hand.targetDepth=Math.max(0,Math.min(1,(.42-Math.hypot(lm[8].x-lm[4].x,lm[8].y-lm[4].y))/.3))});frameLoop=true;const pump=async()=>{if(!frameLoop)return;if(video.readyState>=2)await mpHands.send({image:video});(video.requestVideoFrameCallback?video.requestVideoFrameCallback(()=>pump()):requestAnimationFrame(pump))};pump();notify('摄像头已开启：把一只手放入画面')}catch(e){console.warn(e);stream?.getTracks().forEach(t=>t.stop());stream=null;hand.active=false;document.getElementById('inputState').textContent='鼠标演示';notify('摄像头未授权或不可用，请检查浏览器权限')}}document.getElementById('cameraBtn').onclick=toggleCamera;setup();
</script></body></html>
